# Langfuse for local development — the zero-cost way to get prompt-level traces
# before deciding whether the Fargate stack is worth its standing bill.
#
#   docker compose up -d   →   http://localhost:3000
#
# Then create a project, copy the keys, and set in .env:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:3000/api/public/otel
#   OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic <base64 of publickey:secretkey>

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      # Local-only credentials. Never reuse these anywhere reachable.
      NEXTAUTH_SECRET: local-development-secret-change-me
      SALT: local-development-salt-change-me
      TELEMETRY_ENABLED: "false"

volumes:
  langfuse-db:
